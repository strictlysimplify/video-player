<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #000; overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #container {
      position: relative; width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    iframe {
      width: 100%; height: 100%; border: none;
    }
    .overlay {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
      border-radius: 12px; font-size: 15px; font-weight: 500;
      z-index: 10; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <iframe id="megaFrame" 
            src="https://mega.nz/file/fpomVQoL#yylwKzGpgbJ2JYw73uYX8rLi_GoBGgqcnIDg4z5J6Oo" 
            allowfullscreen>
    </iframe>
    <div class="overlay">Loading video from Mega...</div>
  </div>

  <script>
    // Optional: Hide overlay when video loads
    const frame = document.getElementById('megaFrame');
    frame.onload = () => {
      document.querySelector('.overlay').style.opacity = '0';
    };

    // Keyboard support for fullscreen
    document.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    });
  </script>
</body>
</html>
