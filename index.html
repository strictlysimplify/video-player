<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #000; overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    #container {
      position: relative; width: 100%; height: 100vh;
    }
    iframe {
      width: 100%; height: 100%; border: none;
    }
    .title {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 20px;
      border-radius: 12px; font-size: 16px; font-weight: 600;
      z-index: 10; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="container">
    <iframe id="player" 
            src="https://mega.nz/embed/fpomVQoL#yylwKzGpgbJ2JYw73uYX8rLi_GoBGgqcnIDg4z5J6Oo" 
            allowfullscreen 
            allow="autoplay; fullscreen">
    </iframe>
    <div class="title">Your Video Title</div>
  </div>

  <script>
    // Optional: Fullscreen with F key
    document.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    });
  </script>
</body>
</html>
