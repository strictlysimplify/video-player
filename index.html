<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; background: #000; overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .info {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 600;
      z-index: 100;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <iframe 
      src="https://mega.nz/embed/fpomVQoL#yylwKzGpgbJ2JYw73uYX8rLi_GoBGgqcnIDg4z5J6Oo" 
      allowfullscreen 
      allow="autoplay; fullscreen; encrypted-media">
    </iframe>
    <div class="info">Click Play • Use Fullscreen (F key)</div>
  </div>

  <script>
    // Fullscreen shortcut
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    });
  </script>
</body>
</html>
